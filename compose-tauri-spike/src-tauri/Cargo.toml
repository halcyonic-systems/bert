[package]
name = "compose-tauri-spike"
version = "0.1.0"
edition = "2021"
default-run = "compose-tauri-spike"
description = "Spike: can a web canvas render a live conservation sim driven by Tauri tick events?"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Self-contained: a toy conservation circuit, no bert-compose dependency. The point
# is to measure the canvas/IPC architecture, not reuse the real engine yet.
[workspace]
